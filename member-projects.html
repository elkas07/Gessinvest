<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes projets – GESSINVEST</title>
  <meta name="description" content="Suivi des projets personnels sur GESSINVEST." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Styles généraux */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      flex: 1;
    }
    
    /* En-tête */
    .hero {
      background: linear-gradient(135deg, #2c3e50 0%, #4a6580 100%);
      color: white;
      padding: 2rem 0;
      margin-bottom: 2rem;
    }
    
    .hero-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    .project-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .avatar {
      width: 60px;
      height: 60px;
      background-color: #3498db;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5rem;
    }
    
    .hero h1 {
      font-size: 2rem;
      margin: 0;
    }
    
    /* Boutons */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background-color: #2c3e50;
    }
    
    .btn-primary:hover {
      background-color: #1a2530;
    }
    
    .btn-outline {
      background-color: transparent;
      border: 2px solid #3498db;
      color: #3498db;
    }
    
    .btn-outline:hover {
      background-color: #3498db;
      color: white;
    }
    
    .btn-small {
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    
    /* Filtres */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }
    
    .filters .btn {
      background-color: #f8f9fa;
      color: #333;
      border: 1px solid #ddd;
    }
    
    .filters .btn:hover,
    .filters .btn.active {
      background-color: #2c3e50;
      color: white;
      border-color: #2c3e50;
    }
    
    /* Grille de cartes */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    
    /* Cartes de projet */
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      border: 2px solid #ccc;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    
    .stat-card h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    
    .stat-card p {
      color: #666;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    
    .stat-card strong {
      color: #2c3e50;
    }
    
    /* Barre de progression */
    .progress-bar {
      height: 8px;
      background-color: #eee;
      border-radius: 4px;
      margin: 15px 0;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    }
    
    /* Formulaires */
    .project-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    
    .project-form input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    
    .project-form button {
      width: 100%;
      padding: 12px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    
    .project-form button:hover {
      background-color: #1a2530;
    }
    
    /* Historique */
    .history {
      margin-top: 15px;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    
    .history ul {
      padding-left: 20px;
      margin-top: 8px;
    }
    
    .history li {
      margin-bottom: 5px;
      color: #555;
    }
    
    /* État vide */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-style: italic;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: none;
    }
    
    .empty-state.visible {
      display: block;
    }
    
    .empty-state i {
      font-size: 3rem;
      color: #ddd;
      margin-bottom: 20px;
      display: block;
    }
    
    /* Navigation */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      padding: 15px 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .breadcrumb a {
      color: #3498db;
      text-decoration: none;
    }
    
    .breadcrumb a:hover {
      text-decoration: underline;
    }
    
    .breadcrumb span {
      color: #666;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .hero-inner {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
      
      .project-header {
        flex-direction: column;
        text-align: center;
      }
      
      .filters {
        justify-content: center;
      }
      
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 480px) {
      .filters {
        flex-direction: column;
      }
      
      .filters .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header class="hero" role="banner">
    <div class="hero-inner">
      <div class="project-header" aria-label="En-tête des projets">
        <div class="avatar" aria-hidden="true">MP</div>
        <h1>Mes projets</h1>
      </div>
      <nav>
        <a class="btn btn-primary" href="member.html" aria-label="Retour aux cotisations">← Mes cotisations</a>
      </nav>
    </div>
  </header>

  <!-- Contenu principal -->
  <main class="container" role="main">
    <!-- Navigation fil d'Ariane -->
    <div class="breadcrumb">
      <a href="index.html">Accueil</a>
      <span>→</span>
      <a href="member.html">Espace Membre</a>
      <span>→</span>
      <span>Mes projets</span>
    </div>

    <!-- Filtres -->
    <section class="filters" aria-label="Filtres de projets">
      <button class="btn active" id="flt-tous">Tous les projets</button>
      <button class="btn" id="flt-encours">En cours</button>
      <button class="btn" id="flt-fini">Terminés</button>
      <button class="btn" id="flt-avenir">À venir</button>
    </section>

    <!-- Cartes projets -->
    <section class="card-grid" id="cards" aria-label="Liste des projets">
      <!-- Les cartes seront injectées par JavaScript -->
    </section>

    <!-- État vide -->
    <div id="empty" class="empty-state" aria-live="polite">
      <i class="fas fa-folder-open"></i>
      <p>Aucun projet trouvé avec les filtres sélectionnés.</p>
    </div>
  </main>

  <script>
    // Importation du client Supabase (simulé pour l'exemple)
    const supabase = {
      auth: {
        getUser: async () => {
          // Simulation de l'utilisateur
          return {
            data: { 
              user: { 
                id: 'user-123'
              } 
            },
            error: null
          };
        }
      },
      from: (table) => {
        // Simulation des données pour démonstration
        const mockData = {
          projets_membres: [
            {
              id: 1,
              titre: "Résidence Oasis",
              description: "Construction de 12 logements modernes à N'Djamena avec des espaces verts et des commodités partagées.",
              statut: "en cours",
              objectif: 12000000,
              montant_actuel: 7800000,
              date_debut: "2025-06-01",
              date_fin: "2025-12-01",
              membre_id: "user-123"
            },
            {
              id: 2,
              titre: "Villa Tchad 360",
              description: "Projet de villa locative de luxe avec vue panoramique et équipements haut de gamme.",
              statut: "atteint",
              objectif: 8000000,
              montant_actuel: 8000000,
              date_debut: "2025-03-01",
              date_fin: "2025-09-01",
              membre_id: "user-123"
            },
            {
              id: 3,
              titre: "Immeuble Toumaï",
              description: "Construction d'un immeuble commercial de 8 espaces locatifs dans le centre d'Abéché.",
              statut: "en cours",
              objectif: 6000000,
              montant_actuel: 4500000,
              date_debut: "2025-10-01",
              date_fin: "2026-06-01",
              membre_id: "user-123"
            },
            {
              id: 4,
              titre: "Complexe Sahélien",
              description: "Future construction d'un complexe résidentiel et commercial à Mongo.",
              statut: "à venir",
              objectif: 15000000,
              montant_actuel: 0,
              date_debut: "2026-01-01",
              date_fin: "2026-12-01",
              membre_id: "user-123"
            }
          ],
          contributions: [
            { id: 1, membre_id: "user-123", projet_id: 1, montant: 500000, date_contribution: "2025-08-24" },
            { id: 2, membre_id: "user-123", projet_id: 1, montant: 300000, date_contribution: "2025-07-15" },
            { id: 3, membre_id: "user-123", projet_id: 2, montant: 800000, date_contribution: "2025-06-10" },
            { id: 4, membre_id: "user-123", projet_id: 3, montant: 300000, date_contribution: "2025-08-20" }
          ]
        };
        
        return {
          select: (columns) => {
            return {
              eq: (column, value) => {
                return {
                  order: (orderColumn, options) => {
                    return {
                      then: (callback) => {
                        // Simuler un délai de chargement
                        setTimeout(() => {
                          let filteredData;
                          
                          if (table === 'projets_membres') {
                            filteredData = mockData[table].filter(item => item.membre_id === value);
                          } else if (table === 'contributions') {
                            filteredData = mockData[table].filter(item => item.projet_id === value);
                          } else {
                            filteredData = [];
                          }
                          
                          callback({ 
                            data: filteredData, 
                            error: null 
                          });
                        }, 1000);
                        return {
                          catch: () => {}
                        };
                      }
                    };
                  }
                };
              }
            };
          },
          insert: (data) => {
            // Simulation de l'insertion
            return {
              then: (callback) => {
                setTimeout(() => {
                  // Simuler un succès dans 90% des cas
                  if (Math.random() > 0.1) {
                    // Ajouter la contribution aux données simulées
                    mockData.contributions.push({
                      id: mockData.contributions.length + 1,
                      ...data,
                      date_contribution: new Date().toISOString().split('T')[0]
                    });
                    callback({ error: null });
                  } else {
                    callback({ error: { message: "Erreur d'insertion" } });
                  }
                }, 1000);
                return {
                  catch: () => {}
                };
              }
            };
          }
        };
      }
    };

    async function fetchProjects() {
      const user = await supabase.auth.getUser();
      const userId = user?.data?.user?.id;
      if (!userId) return [];

      const { data, error } = await supabase
        .from('projets_membres')
        .select('id, titre, description, statut, objectif, montant_actuel, date_debut, date_fin')
        .eq('membre_id', userId);

      return error ? [] : data || [];
    }

    async function fetchContributions(projetId) {
      const user = await supabase.auth.getUser();
      const userId = user?.data?.user?.id;
      if (!userId) return [];

      const { data, error } = await supabase
        .from('contributions')
        .select('montant, date_contribution')
        .eq('membre_id', userId)
        .eq('projet_id', projetId)
        .order('date_contribution', { ascending: false });

      return error ? [] : data || [];
    }

    function formatDate(dateStr) {
      if (!dateStr) return '–';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    function createCard(projet) {
      const colors = {
        'en cours': '#ffe9e9',
        'atteint': '#e9fff2',
        'à venir': '#fff9e6'
      };
      const borderColor = {
        'en cours': '#c40000',
        'atteint': '#0f8a4c',
        'à venir': '#9a6a00'
      };
      const progress = Math.min((projet.montant_actuel / projet.objectif) * 100, 100).toFixed(1);

      const card = document.createElement('div');
      card.className = 'stat-card';
      card.style.border = `2px solid ${borderColor[projet.statut] || '#ccc'}`;
      card.style.background = colors[projet.statut] || '#fff';

      card.innerHTML = `
        <h3>${projet.titre}</h3>
        <p>${projet.description}</p>
        <p><strong>Objectif :</strong> ${projet.objectif.toLocaleString()} FCFA</p>
        <p><strong>Montant actuel :</strong> ${projet.montant_actuel.toLocaleString()} FCFA</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <p><strong>Avancement :</strong> ${progress}%</p>
        <p><strong>Statut :</strong> ${projet.statut}</p>
        <p><strong>Début :</strong> ${formatDate(projet.date_debut)} | <strong>Fin :</strong> ${formatDate(projet.date_fin)}</p>
        <form class="project-form" data-id="${projet.id}">
          <input type="number" min="1000" placeholder="Montant à contribuer (FCFA)" required />
          <button type="submit">Contribuer</button>
        </form>
        <div class="history" id="history-${projet.id}" style="margin-top:10px;font-size:14px;color:#555;">Chargement de l'historique...</div>
      `;

      // Formulaire de contribution
      const form = card.querySelector('.project-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const montant = parseInt(form.querySelector('input').value);
        if (!montant || montant < 1000) return alert("Montant invalide");

        const user = await supabase.auth.getUser();
        const userId = user?.data?.user?.id;

        const { error } = await supabase.from('contributions').insert({
          membre_id: userId,
          projet_id: projet.id,
          montant,
          date_contribution: new Date().toISOString()
        });

        if (error) {
          alert("Erreur lors de l'enregistrement.");
          console.error(error.message);
        } else {
          alert(`Contribution de ${montant.toLocaleString()} FCFA enregistrée.`);
          form.reset();
          loadHistory(projet.id);
        }
      });

      // Charger l'historique
      loadHistory(projet.id);

      return card;
    }

    async function loadHistory(projetId) {
      const historyEl = document.getElementById(`history-${projetId}`);
      const contributions = await fetchContributions(projetId);

      if (contributions.length === 0) {
        historyEl.textContent = "Aucune contribution enregistrée.";
        return;
      }

      historyEl.innerHTML = `<strong>Mes contributions :</strong><ul style="padding-left:16px;margin-top:4px;">` +
        contributions.map(c => `<li>${c.montant.toLocaleString()} FCFA le ${formatDate(c.date_contribution)}</li>`).join('') +
        `</ul>`;
    }

    function renderProjects(projects) {
      const container = document.getElementById('cards');
      const empty = document.getElementById('empty');
      container.innerHTML = '';

      if (projects.length === 0) {
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      projects.forEach(p => container.appendChild(createCard(p)));
    }

    function setupFilters(projects) {
      const buttons = {
        'flt-tous': () => projects,
        'flt-encours': () => projects.filter(p => p.statut === 'en cours'),
        'flt-fini': () => projects.filter(p => p.statut === 'atteint'),
        'flt-avenir': () => projects.filter(p => p.statut === 'à venir')
      };

      Object.entries(buttons).forEach(([id, filterFn]) => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.addEventListener('click', () => {
            // Retirer la classe active de tous les boutons
            document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
            // Ajouter la classe active au bouton cliqué
            btn.classList.add('active');
            
            renderProjects(filterFn());
          });
        }
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const projets = await fetchProjects();
      renderProjects(projets);
      setupFilters(projets);
    });
  </script>
</body>
</html>
