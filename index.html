        // ⭐⭐ CORRECTION CRITIQUE ⭐⭐ - Charger le statut KYC de l'utilisateur courant
        async function loadUserKYCStatus() {
            if (!currentUser || !isSupabaseConnected || !window.supabaseClient) {
                currentKYCStatus = 'not_submitted';
                updateKYCStatusDisplay();
                return;
            }

            try {
                const { data: memberData, error: memberError } = await window.supabaseClient
                    .from('members')
                    .select('id')
                    .eq('email', currentUser.email)
                    .single();

                if (memberError || !memberData) {
                    currentKYCStatus = 'not_submitted';
                    updateKYCStatusDisplay();
                    return;
                }

                const memberId = memberData.id;

                const { data: kycData, error: kycError } = await window.supabaseClient
                    .from('kyc_verifications')
                    .select('*')
                    .eq('user_id', memberId)
                    .order('submitted_at', { ascending: false })
                    .limit(1)
                    .maybeSingle(); // ⭐ CORRECTION : Utiliser maybeSingle au lieu de single

                if (kycError && kycError.code !== 'PGRST116') {
                    console.error('Erreur chargement statut KYC:', kycError);
                    currentKYCStatus = 'not_submitted';
                } else if (kycData) {
                    currentKYCStatus = kycData.status || 'not_submitted';
                } else {
                    currentKYCStatus = 'not_submitted';
                }
                
                updateKYCStatusDisplay();
                
            } catch (error) {
                console.error('Erreur chargement statut KYC:', error);
                currentKYCStatus = 'not_submitted';
                updateKYCStatusDisplay();
            }
        }

        // ⭐⭐ CORRECTION - Fonction pour sauvegarder l'image d'un projet ⭐⭐
        async function saveProjectImage(projectId, imageFile) {
            // CORRECTION : Vérifier window.supabaseClient
            if (!isSupabaseConnected || !window.supabaseClient) {
                console.log('📸 Mode hors ligne - Impossible de sauvegarder l\'image');
                return null;
            }

            try {
                // Créer un nom de fichier unique
                const fileName = `project_${projectId}_${Date.now()}.${imageFile.name.split('.').pop()}`;
                
                // Télécharger l'image sur Supabase Storage (bucket 'project-images')
                const { data: uploadData, error: uploadError } = await window.supabaseClient.storage
                    .from('project-images')
                    .upload(fileName, imageFile, {
                        contentType: imageFile.type,
                        upsert: true
                    });

                if (uploadError) throw uploadError;

                // Récupérer l'URL publique de l'image
                const { data: publicUrlData } = window.supabaseClient.storage
                    .from('project-images')
                    .getPublicUrl(fileName);

                const imageUrl = publicUrlData.publicUrl;

                // ⭐⭐ CORRECTION CRITIQUE : Enregistrer dans la table 'project_images' ET mettre à jour 'projects' ⭐⭐
                
                // 1. Insérer dans la table project_images (pour l'historique)
                const { error: imageRecordError } = await window.supabaseClient
                    .from('project_images')
                    .insert({
                        project_id: projectId,
                        image_url: imageUrl,
                        file_name: imageFile.name,
                        file_size: imageFile.size,
                        file_type: imageFile.type
                    });

                if (imageRecordError) {
                    console.warn('⚠️ Avertissement enregistrement project_images:', imageRecordError);
                    // Ne pas bloquer si cette table a un problème
                }

                // 2. Mettre à jour le champ image_url dans la table projects
                const { error: updateError } = await window.supabaseClient
                    .from('projects')
                    .update({ 
                        image_url: imageUrl,
                        image: imageUrl // Mettre à jour les deux champs pour compatibilité
                    })
                    .eq('id', projectId);

                if (updateError) throw updateError;

                console.log('✅ Image sauvegardée avec succès:', imageUrl);
                return imageUrl;

            } catch (error) {
                console.error('❌ Erreur sauvegarde image:', error);
                throw error;
            }
        }

                // Appliquer la recherche
                if (search) {
                    query = query.or(`name.ilike.%${search}%,email.ilike.%${search}%,phone.ilike.%${search}%`);
                }
                
                // Appliquer les filtres de base
                if (role) {
                    query = query.eq('role', role);
                }
                
                if (status) {
                    query = query.eq('status', status);
                }
                
                // Appliquer les filtres avancés
                if (advancedFilters.dateStart) {
                    query = query.gte('created_at', advancedFilters.dateStart);
                }
                
                if (advancedFilters.dateEnd) {
                    query = query.lte('created_at', advancedFilters.dateEnd + ' 23:59:59');
                }
                
                if (advancedFilters.minInvestment) {
                    query = query.gte('total_invested', advancedFilters.minInvestment);
                }
                
                if (advancedFilters.maxInvestment) {
                    query = query.lte('total_invested', advancedFilters.maxInvestment);
                }
                
                // Appliquer le tri
                switch(advancedFilters.sortBy) {
                    case 'created_at_desc':
                        query = query.order('created_at', { ascending: false });
                        break;
                    case 'created_at_asc':
                        query = query.order('created_at', { ascending: true });
                        break;
                    case 'total_invested_desc':
                        query = query.order('total_invested', { ascending: false });
                        break;
                    case 'total_invested_asc':
                        query = query.order('total_invested', { ascending: true });
                        break;
                    case 'name_asc':
                        query = query.order('name', { ascending: true });
                        break;
                    case 'name_desc':
                        query = query.order('name', { ascending: false });
                        break;
                    default:
                        query = query.order('created_at', { ascending: false });
                }
                
                // Appliquer la pagination
                const from = (page - 1) * pageSize;
                const to = from + pageSize - 1;
                
                const { data, error, count } = await query
                    .range(from, to);
                
                if (error) throw error;
                
                users = data || [];
                totalUserCount = count || 0;
                
                // Filtrer par statut KYC si spécifié
                if (kycStatus) {
                    const usersWithKYC = [];
                    for (const user of users) {
                        const kycDoc = kycVerifications.find(k => k.user_id === user.id);
                        if (kycStatus === 'not_submitted' && !kycDoc) {
                            usersWithKYC.push(user);
                        } else if (kycDoc && kycDoc.status === kycStatus) {
                            usersWithKYC.push(user);
                        }
                    }
                    users = usersWithKYC;
                    totalUserCount = users.length;
                }
                
                if (loadingIndicator) {
                    loadingIndicator.classList.remove('active');
                }
                
            } catch (error) {
                console.error('❌ Erreur chargement utilisateurs:', error);
                users = getDefaultUsers();
                totalUserCount = users.length;
                const loadingIndicator = document.getElementById('usersLoading');
                if (loadingIndicator) {
                    loadingIndicator.classList.remove('active');
                }
            }
        }

                    document.getElementById('submitKYCBtn').disabled = true;
                    document.getElementById('uploadProgressContainer').style.display = 'none';
                });
            });
            
            // Gérer le clic sur la zone d'upload
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // Gérer le drag and drop
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = 'var(--accent-color)';
                this.style.backgroundColor = '#fff5f0';
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.style.borderColor = '#cbd5e0';
                this.style.backgroundColor = '#f8fafc';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = '#cbd5e0';
                this.style.backgroundColor = '#f8fafc';
                
                if (e.dataTransfer.files.length > 0) {
                    handleDocumentSelection(e.dataTransfer.files[0]);
                }
            });
            
            // Gérer la sélection de fichier
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleDocumentSelection(e.target.files[0]);
                }
            });
            
            // Mettre à jour le titre initial
            updateDocumentTitle();
        }
        
        function updateDocumentTitle() {
            const titles = {
                'passport': 'Soumettre votre passeport',
                'nni': 'Soumettre votre carte d\'identité nationale (NNI)',
                'driver_license': 'Soumettre votre permis de conduire'
            };
            document.getElementById('selectedDocumentTitle').textContent = titles[selectedDocumentType] || 'Soumettre votre document';
        }
        
        function handleDocumentSelection(file) {
            // Vérifier la taille du fichier (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showNotification('Le fichier est trop volumineux (max. 5MB)', 'error');
                return;
            }
            
            // Vérifier le type de fichier
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'application/pdf'];
            if (!validTypes.includes(file.type)) {
                showNotification('Format de fichier non supporté. Utilisez JPG, PNG ou PDF.', 'error');
                return;
            }
            
            selectedDocumentFile = file;
            
            // Afficher l'aperçu
            const previewContainer = document.getElementById('documentPreviewContainer');
            const documentName = document.getElementById('documentName');
            const previewImg = document.getElementById('documentPreviewImg');
            
            documentName.textContent = file.name;
            
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                previewImg.style.display = 'none';
            }
            
            previewContainer.style.display = 'block';
            document.getElementById('submitKYCBtn').disabled = false;
        }
        
        function removeDocument() {
            selectedDocumentFile = null;
            document.getElementById('documentPreviewContainer').style.display = 'none';
            document.getElementById('submitKYCBtn').disabled = true;
            document.getElementById('uploadProgressContainer').style.display = 'none';
            document.getElementById('kycDocumentUpload').value = '';
        }

        // ⭐⭐ CORRECTION MAJEURE ⭐⭐ - Fonction pour soumettre un document KYC - CORRIGÉ
        async function submitKYCDocument() {
            // Vérifier que l'utilisateur est connecté
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user || !user.email) {
                showNotification('Veuillez vous connecter', 'error');
                return;
            }

            if (!selectedDocumentFile) {
                showNotification('Veuillez sélectionner un document', 'error');
                return;
            }

            if (!isSupabaseConnected || !window.supabaseClient) {
                showNotification('Mode hors ligne - Impossible de soumettre le document', 'warning');
                return;
            }

            try {
                const submitBtn = document.getElementById('submitKYCBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Traitement en cours...';

                const progressContainer = document.getElementById('uploadProgressContainer');
                const progressBar = document.getElementById('uploadProgressBar');
                const progressText = document.getElementById('uploadProgressText');
                const progressPercentage = document.getElementById('uploadPercentage');

                progressContainer.style.display = 'block';
                progressText.textContent = 'Téléchargement du document...';
                progressBar.style.width = '10%';
                progressPercentage.textContent = '10%';

                // 1. Vérifier si le membre existe déjà
                let { data: memberData, error: memberError } = await window.supabaseClient
                    .from('members')
                    .select('*')
                    .eq('email', user.email)
                    .single();

                if (memberError && memberError.code === 'PGRST116') {
                    // Membre non trouvé, le créer
                    const { data: newMember, error: createError } = await window.supabaseClient
                        .from('members')
                        .insert({
                            id: user.id,
                            email: user.email,
                            name: user.user_metadata?.name || user.email.split('@')[0],
                            phone: user.user_metadata?.phone || '',
                            role: 'investor',
                            status: 'active',
                            balance: 0,
                            total_invested: 0
                        })
                        .select()
                        .single();

                    if (createError) {
                        console.error('❌ Erreur création membre:', createError);
                        throw new Error('Impossible de créer votre profil');
                    }
                    memberData = newMember;
                } else if (memberError) {
                    throw memberError;
                }

                console.log('✅ Membre trouvé ou créé:', memberData.id, memberData.email);

                // 2. Uploader le document vers Supabase Storage
                const safeFileName = `${memberData.id}_${Date.now()}_${selectedDocumentType}.${selectedDocumentFile.name.split('.').pop()}`;
                const filePath = `kyc_documents/${safeFileName}`;

                progressBar.style.width = '50%';
                progressPercentage.textContent = '50%';
                progressText.textContent = 'Upload vers le serveur...';

                const { error: uploadError } = await window.supabaseClient.storage
                    .from('kyc_documents')
                    .upload(filePath, selectedDocumentFile, {
                        cacheControl: '3600',
                        upsert: false,
                        contentType: selectedDocumentFile.type
                    });

                if (uploadError) {
                    console.error('❌ Erreur upload storage:', uploadError);
                    throw new Error('Erreur lors du téléchargement du document');
                }

                progressBar.style.width = '70%';
                progressPercentage.textContent = '70%';
                progressText.textContent = 'Récupération de l\'URL...';

                // 3. Récupérer l'URL publique du document
                const { data: urlData } = window.supabaseClient.storage
                    .from('kyc_documents')
                    .getPublicUrl(filePath);

                const fileUrl = urlData.publicUrl;

                progressBar.style.width = '85%';
                progressPercentage.textContent = '85%';
                progressText.textContent = 'Enregistrement dans la base de données...';

                // 4. Vérifier si une vérification KYC existe déjà pour cet utilisateur
                const { data: existingKYC, error: checkError } = await window.supabaseClient
                    .from('kyc_verifications')
                    .select('*')
                    .eq('user_id', memberData.id)
                    .maybeSingle();

                let kycData = {
                    user_id: memberData.id,
                    document_type: selectedDocumentType,
                    status: 'pending', // ⭐ CORRECTION : Statut initial à 'pending'
                    submitted_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    documents: [
                        {
                            type: selectedDocumentType,
                            file_name: selectedDocumentFile.name,
                            file_url: fileUrl,
                            file_size: selectedDocumentFile.size,
                            file_type: selectedDocumentFile.type,
                            uploaded_at: new Date().toISOString()
                        }
                    ]
                };

                let kycResult;
                
                if (existingKYC) {
                    // Mettre à jour l'existant
                    const { data: updatedKYC, error: updateError } = await window.supabaseClient
                        .from('kyc_verifications')
                        .update(kycData)
                        .eq('id', existingKYC.id)
                        .select()
                        .single();

                    if (updateError) throw updateError;
                    kycResult = updatedKYC;
                } else {
                    // Créer un nouvel enregistrement
                    const { data: newKYC, error: insertError } = await window.supabaseClient
                        .from('kyc_verifications')
                        .insert([kycData])
                        .select()
                        .single();

                    if (insertError) throw insertError;
                    kycResult = newKYC;
                }

                progressBar.style.width = '100%';
                progressPercentage.textContent = '100%';
                progressText.textContent = 'Document soumis avec succès !';

                // 5. Mettre à jour le statut local
                currentKYCStatus = 'pending';
                await loadUserKYCStatus();
                updateKYCStatusDisplay();

                // 6. Afficher la notification et fermer
                setTimeout(() => {
                    showNotification('Document KYC soumis avec succès ! Vérification en cours.');
                    closeModal('kycPortalModal');
                    loadKYCVerifications();

                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Soumettre pour vérification';
                    }

                    if (progressContainer) {
                        progressContainer.style.display = 'none';
                    }
                }, 1000);

            } catch (error) {
                console.error('❌ Erreur soumission KYC:', error);

                const submitBtn = document.getElementById('submitKYCBtn');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Soumettre pour vérification';
                }

                const progressContainer = document.getElementById('uploadProgressContainer');
                if (progressContainer) {
                    progressContainer.style.display = 'none';
                }

                let errorMessage = 'Erreur lors de la soumission du document';
                if (error.message.includes('duplicate key')) {
                    errorMessage = 'Vous avez déjà soumis un document KYC. Attendez la vérification ou contactez l\'administrateur.';
                } else if (error.message.includes('storage')) {
                    errorMessage = 'Erreur de stockage du document. Veuillez réessayer.';
                } else if (error.message.includes('403') || error.message.includes('RLS')) {
                    errorMessage = 'Erreur d\'autorisation. Veuillez vous reconnecter.';
                }

                showNotification(errorMessage, 'error');
            }
        }

        // ⭐⭐ NOUVELLE FONCTION ⭐⭐ - Approuver une vérification KYC
        async function approveKYC(kycId = null) {
            const kyc = kycId ? kycVerifications.find(k => k.id === kycId) : currentViewingKYC;
            if (!kyc) return;

            if (!confirm('Êtes-vous sûr de vouloir approuver cette vérification KYC ?')) {
                return;
            }

            try {
                const note = document.getElementById('kycAdminNote').value;
                
                const { error } = await window.supabaseClient
                    .from('kyc_verifications')
                    .update({
                        status: 'verified',
                        updated_at: new Date().toISOString(),
                        reviewed_at: new Date().toISOString(),
                        admin_notes: note || null
                    })
                    .eq('id', kyc.id);

                if (error) throw error;

                showNotification('Vérification KYC approuvée avec succès');
                await loadKYCVerifications();
                updateAdminKYCList();
                document.getElementById('kycDetailsContainer').style.display = 'none';
                document.getElementById('kycAdminNote').value = '';

            } catch (error) {
                console.error('❌ Erreur approbation KYC:', error);
                showNotification('Erreur lors de l\'approbation: ' + error.message, 'error');
            }
        }

        // ⭐⭐ CORRECTION MAJEURE ⭐⭐ - Fonction validateTransaction corrigée
        async function validateTransaction(transactionId) {
            // CORRECTION : Vérifier window.supabaseClient
            if (!isSupabaseConnected || !window.supabaseClient) {
                showNotification('Mode hors ligne - Impossible de valider les transactions', 'warning');
                return;
            }

            try {
                console.log('✅ Validation de la transaction:', transactionId);
                
                // 1. Récupérer la transaction avec vérification du statut 'pending'
                const { data: transaction, error: transactionError } = await window.supabaseClient
                    .from('transactions')
                    .select('*')
                    .eq('id', transactionId)
                    .eq('status', 'pending') // ⭐ VÉRIFIER QU'ELLE EST BIEN EN PENDING ⭐
                    .single();

                if (transactionError) {
                    console.error('❌ Transaction non trouvée ou déjà traitée:', transactionError);
                    showNotification('Cette transaction a déjà été traitée ou n\'existe pas.', 'error');
                    return;
                }

                // ⭐⭐ CORRECTION CRITIQUE - Nettoyer l'ID du membre ⭐⭐
                console.log('transaction.member_id brut:', transaction.member_id);
                const cleanId = String(transaction.member_id).replace(/"/g, '').trim();
                console.log('transaction.member_id nettoyé:', cleanId);

                // ⭐⭐ CORRECTION CRITIQUE - Utiliser maybeSingle au lieu de single ⭐⭐
                const { data: member, error: memberError } = await window.supabaseClient
                    .from('members')
                    .select('*')
                    .eq('id', cleanId)   // ⭐ CORRECTION: UUID sans guillemets parasites
                    .maybeSingle(); // ⭐ CORRECTION: maybeSingle au lieu de single

                if (memberError) {
                    console.error('❌ Erreur récupération membre:', memberError);
                    showNotification('Erreur: Impossible de récupérer le membre.', 'error');
                    return;
                }

                if (!member) {
                    console.error('❌ Membre non trouvé avec l\'ID:', cleanId);
                    showNotification('Erreur: Membre non trouvé. L\'ID peut être invalide.', 'error');
                    return;
                }

                console.log('✅ Membre trouvé:', member);

                // 3. Traiter selon le type de transaction
                if (transaction.type === 'deposit') {
                    // Mise à jour du solde du membre
                    const newBalance = (member.balance || 0) + transaction.amount;
                    const { error: updateError } = await window.supabaseClient
                        .from('members')
                        .update({ balance: newBalance })
                        .eq('id', member.id);

                    if (updateError) {
                        console.error('❌ Erreur mise à jour solde:', updateError);
                        throw updateError;
                    }

                    showNotification(`Dépôt de ${formatCFA(transaction.amount)} validé ! Solde mis à jour.`);

                } else if (transaction.type === 'investment') {
                    // Vérifier le solde
                    if (member.balance < transaction.amount) {
                        showNotification('Solde insuffisant pour valider cet investissement', 'error');
                        return;
                    }

                    // Mettre à jour le solde et total investi du membre
                    const newBalance = member.balance - transaction.amount;
                    const { error: updateBalanceError } = await window.supabaseClient
                        .from('members')
                        .update({ 
                            balance: newBalance,
                            total_invested: (member.total_invested || 0) + transaction.amount
                        })
                        .eq('id', member.id);

                    if (updateBalanceError) throw updateBalanceError;

                    // Mettre à jour le projet
                    const project = projects.find(p => p.id == transaction.project_id);
                    if (project) {
                        const newCollectedAmount = project.collected + transaction.amount;
                        const { error: updateProjectError } = await window.supabaseClient
                            .from('projects')
                            .update({ collected: newCollectedAmount })
                            .eq('id', transaction.project_id);

                        if (updateProjectError) throw updateProjectError;

                        project.collected = newCollectedAmount;
                        
                        // Vérifier si le projet est complet
                        if (newCollectedAmount >= project.target) {
                            project.status = 'completed';
                        }
                    }

                    // Créer la contribution
                    const { error: contributionError } = await window.supabaseClient
                        .from('contributions')
                        .insert([
                            {
                                member_id: member.id,
                                project_id: transaction.project_id,
                                amount: transaction.amount,
                                payment_method: transaction.payment_method,
                                status: 'completed',
                                created_at: new Date().toISOString()
                            }
                        ]);

                    if (contributionError) throw contributionError;

                    showNotification(`Investissement de ${formatCFA(transaction.amount)} validé ! Projet mis à jour.`);
                }

                // 4. Mettre à jour le statut de la transaction en 'completed'
                const { error: updateStatusError } = await window.supabaseClient
                    .from('transactions')
                    .update({ 
                        status: 'validated',
                        validated_at: new Date().toISOString(),
                        rejected_at: null
                    })
                    .eq('id', transactionId);

                if (updateStatusError) throw updateStatusError;

                // 5. Retirer immédiatement la ligne du tableau
                removeTransactionRow(transactionId);

                // 6. Supprimer de la liste locale
                pendingTransactions = pendingTransactions.filter(t => t.id !== transactionId);

                // 7. Recharger les données
                await loadPendingTransactions();
                await loadProjects();
                await loadContributions();
                await loadUsers();
                
                // 8. Mettre à jour les dashboards
                if (currentUser && currentUser.email === 'elkas07@live.fr') {
                    updateAdminDashboard();
                } else if (currentUser) {
                    updateMemberDashboard();
                }
                
                console.log('✅ Transaction validée avec succès:', transactionId);
                
            } catch (error) {
                console.error('❌ Erreur validation transaction:', error);
                showNotification('Erreur lors de la validation: ' + error.message, 'error');
            }
        }

        // ⭐⭐ CORRECTION CRITIQUE ⭐⭐ - Fonction rejectTransaction corrigée
        async function rejectTransaction(transactionId) {
            // CORRECTION : Vérifier window.supabaseClient
            if (!isSupabaseConnected || !window.supabaseClient) {
                showNotification('Mode hors ligne - Impossible de rejeter les transactions', 'warning');
                return;
            }

            if (confirm('Êtes-vous sûr de vouloir refuser cette transaction ?')) {
                try {
                    console.log('❌ Rejet de la transaction:', transactionId);
                    
                    // 1. Vérifier que la transaction existe et est en 'pending'
                    const { data: transaction, error: checkError } = await window.supabaseClient
                        .from('transactions')
                        .select('*')
                        .eq('id', transactionId)
                        .eq('status', 'pending')
                        .maybeSingle(); // CORRECTION: Utiliser maybeSingle au lieu de single

                    if (checkError) {
                        console.error('❌ Erreur vérification transaction:', checkError);
                        showNotification('Erreur lors de la vérification de la transaction.', 'error');
                        return;
                    }

                    if (!transaction) {
                        showNotification('Transaction non trouvée ou déjà traitée.', 'error');
                        return;
                    }

                    // 2. Mettre à jour le statut en 'rejected' avec vérification de succès
                    const { error: updateError, count } = await window.supabaseClient
                        .from('transactions')
                        .update({ 
                            status: 'rejected',
                            rejected_at: new Date().toISOString()
                        })
                        .eq('id', transactionId)
                        .eq('status', 'pending'); // CORRECTION: S'assurer qu'elle était bien en pending

                    if (updateError) {
                        console.error('❌ Erreur mise à jour statut:', updateError);
                        throw updateError;
                    }

                    // Vérifier qu'une ligne a bien été mise à jour
                    if (count === 0) {
                        console.warn('⚠️ Aucune ligne mise à jour - transaction déjà traitée');
                        showNotification('Cette transaction a déjà été traitée.', 'warning');
                        return;
                    }

                    console.log(`✅ Transaction ${transactionId} rejetée avec succès. Lignes affectées: ${count}`);
                    
                    // 3. Supprimer immédiatement la ligne du tableau
                    removeTransactionRow(transactionId);
                    
                    // 4. Mettre à jour les données locales
                    pendingTransactions = pendingTransactions.filter(t => t.id !== transactionId);
                    
                    // 5. Mettre à jour les compteurs
                    updateAdminDashboard();
                    
                    // 6. Mettre à jour la notification
                    showNotification(`Transaction ${transactionId} rejetée avec succès.`);
                    
                } catch (error) {
                    console.error('❌ Erreur rejet transaction:', error);
                    showNotification('Erreur lors du rejet: ' + error.message, 'error');
                }
            }
        }

        // ⭐⭐ NOUVELLE FONCTION ⭐⭐ - Retirer une ligne du tableau immédiatement
        function removeTransactionRow(transactionId) {
            const tableBody = document.getElementById('adminPendingTransactions');
            if (!tableBody) return;
            
            // Trouver la ligne avec l'ID de transaction
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const validateBtn = row.querySelector('.btn-validate');
                if (validateBtn && validateBtn.onclick && 
                    validateBtn.onclick.toString().includes(`'${transactionId}'`)) {
                    row.remove();
                }
            });
            
            // Vérifier s'il reste des transactions
            const remainingRows = tableBody.querySelectorAll('tr');
            if (remainingRows.length === 0 || 
                (remainingRows.length === 1 && remainingRows[0].querySelector('td[colspan]'))) {
                tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Aucune transaction en attente</td></tr>';
            }
        }

            // ⭐⭐ CORRECTION - Formulaire de création de projet ⭐⭐
            document.getElementById('addProjectForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const name = document.getElementById('project-name').value;
                const description = document.getElementById('project-description').value;
                const location = document.getElementById('project-location').value;
                const target = parseInt(document.getElementById('project-target').value);
                const returnRate = parseFloat(document.getElementById('project-return').value);
                const duration = parseInt(document.getElementById('project-duration').value);
                const imageFile = document.getElementById('project-image-upload').files[0];
                
                try {
                    // Créer le projet sans image d'abord
                    const { data: project, error: projectError } = await window.supabaseClient
                        .from('projects')
                        .insert([{
                            name: name,
                            description: description,
                            location: location,
                            target: target,
                            collected: 0,
                            return_rate: returnRate,
                            days_left: duration,
                            status: 'active'
                        }])
                        .select()
                        .single();
                    
                    if (projectError) throw projectError;
                    
                    // Si une image est fournie, l'uploader
                    let imageUrl = null;
                    if (imageFile) {
                        try {
                            imageUrl = await saveProjectImage(project.id, imageFile);
                        } catch (imageError) {
                            console.warn('⚠️ Erreur upload image:', imageError);
                            // Continuer même si l'image échoue
                        }
                    }
                    
                    showNotification('Projet créé avec succès !');
                    closeModal('addProjectModal');
                    
                    // Recharger les projets
                    await loadProjects();
                    updateProjectsDisplay();
                    updateAdminDashboard();
                    
                } catch (error) {
                    console.error('❌ Erreur création projet:', error);
                    showNotification('Erreur lors de la création du projet: ' + error.message, 'error');
                }
            });

            // ⭐⭐ CORRECTION - Formulaire de modification de projet ⭐⭐
            document.getElementById('editProjectForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!currentEditingProject) return;
                
                const name = document.getElementById('edit-project-name').value;
                const description = document.getElementById('edit-project-description').value;
                const location = document.getElementById('edit-project-location').value;
                const target = parseInt(document.getElementById('edit-project-target').value);
                const collected = parseInt(document.getElementById('edit-project-current').value);
                const returnRate = parseFloat(document.getElementById('edit-project-return').value);
                const duration = parseInt(document.getElementById('edit-project-duration').value);
                const status = document.getElementById('edit-project-status').value;
                const imageFile = document.getElementById('edit-project-image-upload').files[0];
                
                try {
                    // Préparer les données de mise à jour
                    const updateData = {
                        name: name,
                        description: description,
                        location: location,
                        target: target,
                        collected: collected,
                        return_rate: returnRate,
                        days_left: duration,
                        status: status,
                        updated_at: new Date().toISOString()
                    };
                    
                    // Si une nouvelle image est fournie, l'uploader
                    let imageUrl = null;
                    if (imageFile) {
                        try {
                            imageUrl = await saveProjectImage(currentEditingProject.id, imageFile);
                            if (imageUrl) {
                                updateData.image_url = imageUrl;
                                updateData.image = imageUrl;
                            }
                        } catch (imageError) {
                            console.warn('⚠️ Erreur upload image:', imageError);
                            // Continuer même si l'image échoue
                        }
                    }
                    
                    // Mettre à jour le projet
                    const { error: updateError } = await window.supabaseClient
                        .from('projects')
                        .update(updateData)
                        .eq('id', currentEditingProject.id);
                    
                    if (updateError) throw updateError;
                    
                    showNotification('Projet modifié avec succès !');
                    closeModal('editProjectModal');
                    
                    // Recharger les projets
                    await loadProjects();
                    updateProjectsDisplay();
                    updateAdminDashboard();
                    
                } catch (error) {
                    console.error('❌ Erreur modification projet:', error);
                    showNotification('Erreur lors de la modification du projet: ' + error.message, 'error');
                }
            });

            // Formulaire des paramètres de commission
            document.getElementById('commissionSettingsForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                commissionSettings.defaultRate = parseFloat(document.getElementById('default-commission-rate').value);
                commissionSettings.calculationMethod = document.getElementById('commission-calculation-method').value;
                
                // Sauvegarder localement
                localStorage.setItem('gessinvest_commission_settings', JSON.stringify(commissionSettings));
                
                showNotification('Paramètres de commission enregistrés !');
                closeModal('commissionSettingsModal');

            // Formulaire de modification de commission de projet
            document.getElementById('editProjectCommissionForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const projectId = document.getElementById('edit-project-commission-rate').getAttribute('data-project-id');
                const commissionRate = parseFloat(document.getElementById('edit-project-commission-rate').value);
                const note = document.getElementById('edit-project-commission-note').value;
                
                if (!projectId) {
                    showNotification('Erreur: Projet non spécifié', 'error');
                    return;
                }
                
                try {
                    const project = projects.find(p => p.id == projectId);
                    if (!project) {
                        showNotification('Erreur: Projet non trouvé', 'error');
                        return;
                    }
                    
                    const commissionAmount = project.collected * (commissionRate / 100);
                    
                    // Vérifier si une commission existe déjà pour ce projet
                    const existingCommission = commissions.find(c => c.project_id == projectId);
                    
                    if (existingCommission) {
                        // Mettre à jour l'existant
                        const { error: updateError } = await window.supabaseClient
                            .from('commissions')
                            .update({
                                commission_rate: commissionRate,
                                commission_amount: commissionAmount,
                                note: note,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', existingCommission.id);
                        
                        if (updateError) throw updateError;
                    } else {
                        // Créer une nouvelle commission
                        const { error: insertError } = await window.supabaseClient
                            .from('commissions')
                            .insert({
                                project_id: projectId,
                                commission_rate: commissionRate,
                                commission_amount: commissionAmount,
                                status: 'active',
                                note: note
                            });
                        
                        if (insertError) throw insertError;
                    }
                    
                    showNotification('Commission modifiée avec succès !');
                    closeModal('editProjectCommissionModal');
                    
                    // Recharger les commissions
                    await loadCommissions();
                    updateAdminDashboard();
                    
                } catch (error) {
                    console.error('❌ Erreur modification commission:', error);
                    showNotification('Erreur lors de la modification de la commission: ' + error.message, 'error');
                }
            });

                const role = document.getElementById('edit-user-role').value;
                const status = document.getElementById('edit-user-status').value;
                const balance = parseInt(document.getElementById('edit-user-balance').value);
                
                try {
                    const { error } = await window.supabaseClient

                            name: name,
                            email: email,
                            phone: phone,
                            role: role,
                            status: status,
                            balance: balance,
                            updated_at: new Date().toISOString()
                        })

                    if (error) throw error;
                    
                    showNotification('Utilisateur modifié avec succès !');
                    closeModal('editUserModal');
                    
                    // Recharger les utilisateurs
                    await loadUsers(currentUserPage, userPageSize, userSearchTerm, userRoleFilter, userStatusFilter);
                    updateAdminDashboard();
                    
                } catch (error) {
                    console.error('❌ Erreur modification utilisateur:', error);
                    showNotification('Erreur lors de la modification de l\'utilisateur: ' + error.message, 'error');
                }
            });

            // Écouteurs pour les filtres utilisateurs
            document.getElementById('userSearch').addEventListener('input', function(e) {
                userSearchTerm = e.target.value;
                currentUserPage = 1;
                loadUsers(currentUserPage, userPageSize, userSearchTerm, userRoleFilter, userStatusFilter, userKYCStatusFilter);

            document.getElementById('userStatusFilter').addEventListener('change', function(e) {

            document.getElementById('userKYCStatusFilter').addEventListener('change', function(e) {
                userKYCStatusFilter = e.target.value;
                currentUserPage = 1;
                loadUsers(currentUserPage, userPageSize, userSearchTerm, userRoleFilter, userStatusFilter, userKYCStatusFilter);

            document.getElementById('userPageSize').addEventListener('change', function(e) {
                userPageSize = parseInt(e.target.value);

                loadUsers(currentUserPage, userPageSize, userSearchTerm, userRoleFilter, userStatusFilter, userKYCStatusFilter);

                // Implémentez le filtrage KYC ici si nécessaire

            // Configuration du simulateur
            setupSimulator();
            
            // Configuration de l'upload d'image
            setupImageUpload();
            
            // Configuration de l'upload KYC
            initKYCDocumentUpload();
            
            // Écouteur pour l'affichage du montant
            document.getElementById('investmentAmount').addEventListener('input', updateAmountDisplay);
            document.getElementById('fundsAmount').addEventListener('input', updateFundsAmountDisplay);
        }

        // ⭐⭐ CORRECTION - Configuration du menu mobile ⭐⭐
        function setupMobileMenu() {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const navLinks = document.getElementById('navLinks');
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
            
            if (mobileMenuBtn && navLinks) {
                mobileMenuBtn.addEventListener('click', function() {
                    const isActive = navLinks.classList.contains('active');
                    
                    if (isActive) {
                        closeMobileMenu();
                    } else {
                        openMobileMenu();
                    }
                });
            }
            
            if (mobileMenuOverlay) {
                mobileMenuOverlay.addEventListener('click', closeMobileMenu);
            }
        }

        function openMobileMenu() {
            const navLinks = document.getElementById('navLinks');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
            
            if (navLinks) navLinks.classList.add('active');
            if (mobileMenuBtn) {
                mobileMenuBtn.classList.add('active');
                mobileMenuBtn.setAttribute('aria-expanded', 'true');
            }
            if (mobileMenuOverlay) mobileMenuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileMenu() {
            const navLinks = document.getElementById('navLinks');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
            
            if (navLinks) navLinks.classList.remove('active');
            if (mobileMenuBtn) {
                mobileMenuBtn.classList.remove('active');
                mobileMenuBtn.setAttribute('aria-expanded', 'false');
            }
            if (mobileMenuOverlay) mobileMenuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Fonction pour afficher les notifications
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notification-message');
            
            if (!notification || !notificationMessage) return;
            
            // Mettre à jour le message et le type
            notificationMessage.textContent = message;
            notification.className = 'notification';
            
            // Ajouter la classe de type
            if (type === 'error') {
                notification.classList.add('error');
            } else if (type === 'warning') {
                notification.classList.add('warning');
            }
            
            // Afficher la notification
            notification.style.display = 'flex';
            
            // Masquer automatiquement après 5 secondes
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }
