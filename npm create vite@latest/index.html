        :root { --bricks-orange: #ff6b35; --bricks-navy: #0d1b2a; }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ff6b35;
            cursor: pointer;
            border: 4px solid white;
