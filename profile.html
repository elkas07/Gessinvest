<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Profil – GESSINVEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Styles généraux */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      flex: 1;
    }
    
    /* En-tête */
    .header {
      background: linear-gradient(135deg, #2c3e50 0%, #4a6580 100%);
      color: white;
      padding: 2rem 0;
      margin-bottom: 2rem;
    }
    
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .user-avatar {
      width: 70px;
      height: 70px;
      background-color: #3498db;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.8rem;
      position: relative;
    }
    
    .avatar-edit {
      position: absolute;
      bottom: 0;
      right: 0;
      background: white;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .avatar-edit i {
      color: #3498db;
      font-size: 0.8rem;
    }
    
    .page-title {
      font-size: 2rem;
      margin: 0;
    }
    
    /* Boutons */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      font-size: 1rem;
    }
    
    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background-color: #2c3e50;
      padding: 15px 30px;
      font-size: 1.1rem;
    }
    
    .btn-primary:hover {
      background-color: #1a2530;
    }
    
    .btn-secondary {
      background-color: #95a5a6;
    }
    
    .btn-secondary:hover {
      background-color: #7f8c8d;
    }
    
    .btn-outline {
      background-color: transparent;
      border: 2px solid #3498db;
      color: #3498db;
    }
    
    .btn-outline:hover {
      background-color: #3498db;
      color: white;
    }
    
    .btn-small {
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    
    /* Sections */
    .section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    
    .section h2 {
      color: #2c3e50;
      margin-bottom: 25px;
      font-size: 1.5rem;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
    }
    
    /* Formulaires */
    .card-form {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #2c3e50;
      font-size: 1rem;
    }
    
    input, select {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }
    
    input::placeholder {
      color: #aaa;
    }
    
    input:disabled {
      background-color: #f8f9fa;
      color: #666;
      cursor: not-allowed;
    }
    
    /* Messages */
    .form-message {
      padding: 15px;
      margin: 20px 0;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    
    .form-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    
    .form-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    
    .form-message.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
    
    /* Navigation */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      padding: 15px 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .breadcrumb a {
      color: #3498db;
      text-decoration: none;
    }
    
    .breadcrumb a:hover {
      text-decoration: underline;
    }
    
    .breadcrumb span {
      color: #666;
    }
    
    /* Statistiques du profil */
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .stat-item {
      text-align: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    
    .stat-label {
      color: #666;
      font-size: 0.9rem;
    }
    
    /* Section de sécurité */
    .security-section {
      border-top: 2px solid #f0f0f0;
      padding-top: 25px;
      margin-top: 25px;
    }
    
    .security-actions {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    /* Pied de page */
    .footer {
      text-align: center;
      padding: 2rem 0;
      margin-top: auto;
      color: #666;
      border-top: 1px solid #ddd;
      background-color: white;
    }
    
    /* Modal pour l'avatar */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    
    .modal h3 {
      margin-bottom: 20px;
      color: #2c3e50;
    }
    
    .modal-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
      
      .user-info {
        flex-direction: column;
      }
      
      .profile-stats {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .security-actions {
        flex-direction: column;
      }
      
      .section {
        padding: 20px;
      }
      
      .container {
        padding: 0 15px;
      }
    }
    
    @media (max-width: 480px) {
      .profile-stats {
        grid-template-columns: 1fr;
      }
      
      .modal-content {
        width: 95%;
        padding: 20px;
      }
      
      .modal-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header-content container">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">
          PR
          <div class="avatar-edit" id="edit-avatar">
            <i class="fas fa-camera"></i>
          </div>
        </div>
        <h1 class="page-title">Mon profil</h1>
      </div>
      <div class="form-actions">
        <a href="member.html" class="btn btn-secondary">← Espace membre</a>
      </div>
    </div>
  </header>

  <!-- Contenu principal -->
  <main class="container">
    <!-- Navigation fil d'Ariane -->
    <div class="breadcrumb">
      <a href="index.html">Accueil</a>
      <span>→</span>
      <a href="member.html">Espace Membre</a>
      <span>→</span>
      <span>Mon Profil</span>
    </div>

    <!-- Statistiques du profil -->
    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-cotisations">12</div>
        <div class="stat-label">Cotisations</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-projets">3</div>
        <div class="stat-label">Projets</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-investi">120K XAF</div>
        <div class="stat-label">Investi</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-membre">2 ans</div>
        <div class="stat-label">Membre depuis</div>
      </div>
    </div>

    <!-- ========== FORMULAIRE PROFIL ========== -->
    <section class="section">
      <h2>Informations personnelles</h2>
      <div class="card-form">
        <form id="profile-form">
          <div class="form-group">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom complet" value="Patrick Rakotoseheno" />
          </div>

          <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" name="telephone" placeholder="+235 66 00 00 00" value="+235 66 12 34 56" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="exemple@mail.com" value="patrick@example.com" />
          </div>

          <div class="form-group">
            <label for="ville">Ville</label>
            <input type="text" id="ville" name="ville" placeholder="Votre ville" value="N'Djamena" />
          </div>

          <div class="form-group">
            <label for="statut">Statut de membre</label>
            <input type="text" id="statut" name="statut" value="Membre actif" disabled />
          </div>

          <div class="form-group">
            <label for="date-inscription">Date d'inscription</label>
            <input type="text" id="date-inscription" name="date-inscription" value="15 janvier 2023" disabled />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="save">
              <i class="fas fa-save"></i> Enregistrer les modifications
            </button>
          </div>
        </form>
        <div id="profile-message" class="form-message"></div>
      </div>
    </section>

    <!-- ========== SECTION SÉCURITÉ ========== -->
    <section class="section">
      <h2>Sécurité du compte</h2>
      <div class="security-section">
        <div class="form-group">
          <label for="password-current">Mot de passe actuel</label>
          <input type="password" id="password-current" name="password-current" placeholder="Entrez votre mot de passe actuel" />
        </div>

        <div class="form-group">
          <label for="password-new">Nouveau mot de passe</label>
          <input type="password" id="password-new" name="password-new" placeholder="Entrez votre nouveau mot de passe" />
        </div>

        <div class="form-group">
          <label for="password-confirm">Confirmer le nouveau mot de passe</label>
          <input type="password" id="password-confirm" name="password-confirm" placeholder="Confirmez votre nouveau mot de passe" />
        </div>

        <div class="security-actions">
          <button type="button" class="btn btn-outline" id="change-password">
            <i class="fas fa-key"></i> Changer le mot de passe
          </button>
          <button type="button" class="btn btn-outline" id="logout-all">
            <i class="fas fa-sign-out-alt"></i> Se déconnecter de tous les appareils
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal pour changer l'avatar -->
  <div class="modal" id="avatar-modal">
    <div class="modal-content">
      <h3>Changer votre avatar</h3>
      <p>Choisissez une nouvelle image pour votre profil</p>
      
      <div style="margin: 20px 0;">
        <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
          <div style="width: 60px; height: 60px; background: #3498db; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer;">PR</div>
          <div style="width: 60px; height: 60px; background: #e74c3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer;">PR</div>
          <div style="width: 60px; height: 60px; background: #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer;">PR</div>
        </div>
        
        <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
        <button type="button" class="btn btn-outline btn-small" onclick="document.getElementById('avatar-upload').click()">
          <i class="fas fa-upload"></i> Télécharger une image
        </button>
      </div>
      
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-avatar">Annuler</button>
        <button type="button" class="btn btn-primary" id="save-avatar">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <p>&copy; 2025 GESSINVEST – Profil utilisateur</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const profileForm = document.getElementById('profile-form');
      const messageDiv = document.getElementById('profile-message');
      const avatarEdit = document.getElementById('edit-avatar');
      const avatarModal = document.getElementById('avatar-modal');
      const cancelAvatar = document.getElementById('cancel-avatar');
      const saveAvatar = document.getElementById('save-avatar');
      const changePasswordBtn = document.getElementById('change-password');
      const logoutAllBtn = document.getElementById('logout-all');
      
      // Données simulées de l'utilisateur
      const userData = {
        nom: 'Patrick Rakotoseheno',
        telephone: '+235 66 12 34 56',
        email: 'patrick@example.com',
        ville: 'N\'Djamena',
        statut: 'Membre actif',
        dateInscription: '15 janvier 2023',
        cotisations: 12,
        projets: 3,
        investi: '120,000',
        membreDepuis: '2 ans'
      };
      
      // Initialiser les valeurs du formulaire
      document.getElementById('nom').value = userData.nom;
      document.getElementById('telephone').value = userData.telephone;
      document.getElementById('email').value = userData.email;
      document.getElementById('ville').value = userData.ville;
      document.getElementById('statut').value = userData.statut;
      document.getElementById('date-inscription').value = userData.dateInscription;
      
      // Mettre à jour les statistiques
      document.getElementById('stat-cotisations').textContent = userData.cotisations;
      document.getElementById('stat-projets').textContent = userData.projets;
      document.getElementById('stat-investi').textContent = userData.investi + ' XAF';
      document.getElementById('stat-membre').textContent = userData.membreDepuis;
      
      // Soumission du formulaire de profil
      profileForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Récupérer les valeurs du formulaire
        const nom = document.getElementById('nom').value;
        const telephone = document.getElementById('telephone').value;
        const email = document.getElementById('email').value;
        const ville = document.getElementById('ville').value;
        
        // Validation basique
        if (!nom || !telephone || !email || !ville) {
          showMessage('Veuillez remplir tous les champs obligatoires', 'error');
          return;
        }
        
        if (!isValidEmail(email)) {
          showMessage('Veuillez entrer une adresse email valide', 'error');
          return;
        }
        
        // Simuler la sauvegarde
        showMessage('Sauvegarde en cours...', 'info');
        
        setTimeout(() => {
          showMessage('Profil mis à jour avec succès!', 'success');
          
          // Mettre à jour les données simulées
          userData.nom = nom;
          userData.telephone = telephone;
          userData.email = email;
          userData.ville = ville;
        }, 1500);
      });
      
      // Gestion de l'avatar
      avatarEdit.addEventListener('click', function() {
        avatarModal.style.display = 'flex';
      });
      
      cancelAvatar.addEventListener('click', function() {
        avatarModal.style.display = 'none';
      });
      
      saveAvatar.addEventListener('click', function() {
        // Simuler le changement d'avatar
        showMessage('Avatar mis à jour avec succès!', 'success');
        avatarModal.style.display = 'none';
      });
      
      // Gestion du changement de mot de passe
      changePasswordBtn.addEventListener('click', function() {
        const currentPassword = document.getElementById('password-current').value;
        const newPassword = document.getElementById('password-new').value;
        const confirmPassword = document.getElementById('password-confirm').value;
        
        if (!currentPassword || !newPassword || !confirmPassword) {
          showMessage('Veuillez remplir tous les champs du mot de passe', 'error');
          return;
        }
        
        if (newPassword !== confirmPassword) {
          showMessage('Les nouveaux mots de passe ne correspondent pas', 'error');
          return;
        }
        
        if (newPassword.length < 8) {
          showMessage('Le mot de passe doit contenir au moins 8 caractères', 'error');
          return;
        }
        
        // Simuler le changement de mot de passe
        showMessage('Mot de passe changé avec succès!', 'success');
        
        // Réinitialiser les champs
        document.getElementById('password-current').value = '';
        document.getElementById('password-new').value = '';
        document.getElementById('password-confirm').value = '';
      });
      
      // Déconnexion de tous les appareils
      logoutAllBtn.addEventListener('click', function() {
        if (confirm('Êtes-vous sûr de vouloir vous déconnecter de tous les appareils ?')) {
          showMessage('Déconnexion effectuée sur tous les appareils', 'success');
        }
      });
      
      // Fonction pour valider l'email
      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }
      
      // Fonction pour afficher les messages
      function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = 'form-message ' + type;
        
        // Cacher le message après 5 secondes
        setTimeout(() => {
          messageDiv.style.display = 'none';
        }, 5000);
      }
      
      // Fermer la modal en cliquant à l'extérieur
      window.addEventListener('click', function(e) {
        if (e.target === avatarModal) {
          avatarModal.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
