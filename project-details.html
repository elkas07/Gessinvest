<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du projet – GESSINVEST</title>
  <meta name="description" content="Consultez les détails du projet sur GESSINVEST." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Styles généraux */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      flex: 1;
    }
    
    /* En-tête */
    .hero {
      background: linear-gradient(135deg, #2c3e50 0%, #4a6580 100%);
      color: white;
      padding: 2rem 0;
      margin-bottom: 2rem;
    }
    
    .hero-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    .project-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .avatar {
      width: 60px;
      height: 60px;
      background-color: #3498db;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5rem;
    }
    
    .hero h1 {
      font-size: 2rem;
      margin: 0;
    }
    
    /* Boutons */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background-color: #2c3e50;
    }
    
    .btn-primary:hover {
      background-color: #1a2530;
    }
    
    .btn-secondary {
      background-color: #95a5a6;
    }
    
    .btn-secondary:hover {
      background-color: #7f8c8d;
    }
    
    .btn-success {
      background-color: #2ecc71;
    }
    
    .btn-success:hover {
      background-color: #27ae60;
    }
    
    .btn-outline {
      background-color: transparent;
      border: 2px solid #3498db;
      color: #3498db;
    }
    
    .btn-outline:hover {
      background-color: #3498db;
      color: white;
    }
    
    .btn-small {
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    
    /* Navigation */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      padding: 15px 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .breadcrumb a {
      color: #3498db;
      text-decoration: none;
    }
    
    .breadcrumb a:hover {
      text-decoration: underline;
    }
    
    .breadcrumb span {
      color: #666;
    }
    
    /* Layout principal */
    .project-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
      margin-bottom: 40px;
    }
    
    @media (max-width: 968px) {
      .project-layout {
        grid-template-columns: 1fr;
      }
    }
    
    /* Carte principale du projet */
    .project-main {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .project-image {
      height: 300px;
      overflow: hidden;
      position: relative;
    }
    
    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .project-status {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-encours {
      background-color: #3498db;
      color: white;
    }
    
    .status-termine {
      background-color: #2ecc71;
      color: white;
    }
    
    .status-avenir {
      background-color: #f39c12;
      color: white;
    }
    
    .project-content {
      padding: 30px;
    }
    
    .project-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    
    .project-location {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    
    .project-location i {
      color: #e74c3c;
    }
    
    .project-description {
      color: #555;
      line-height: 1.7;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }
    
    /* Barre de progression */
    .progress-section {
      margin: 30px 0;
    }
    
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .progress-title {
      font-weight: 600;
      color: #2c3e50;
    }
    
    .progress-percentage {
      font-weight: 700;
      color: #2c3e50;
      font-size: 1.2rem;
    }
    
    .progress-container {
      height: 12px;
      background-color: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .progress-bar {
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s ease;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    }
    
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #666;
    }
    
    /* Détails financiers */
    .financial-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 25px 0;
    }
    
    @media (max-width: 480px) {
      .financial-details {
        grid-template-columns: 1fr;
      }
    }
    
    .financial-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .financial-label {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }
    
    .financial-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2c3e50;
    }
    
    /* Actions */
    .project-actions {
      display: flex;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    
    /* Sidebar */
    .project-sidebar {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    
    .sidebar-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .sidebar-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    /* Détails du projet */
    .project-info {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .info-label {
      color: #666;
      font-weight: 500;
    }
    
    .info-value {
      color: #2c3e50;
      font-weight: 600;
    }
    
    /* Participants */
    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .participant-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    
    .participant-item:hover {
      background-color: #f8f9fa;
    }
    
    .participant-avatar {
      width: 40px;
      height: 40px;
      background-color: #3498db;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      font-size: 0.9rem;
    }
    
    .participant-name {
      font-weight: 500;
      color: #2c3e50;
    }
    
    .participant-amount {
      margin-left: auto;
      font-weight: 600;
      color: #2c3e50;
    }
    
    /* Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .timeline-item {
      display: flex;
      gap: 15px;
      position: relative;
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 25px;
      bottom: -25px;
      width: 2px;
      background-color: #e0e0e0;
    }
    
    .timeline-item:last-child::before {
      display: none;
    }
    
    .timeline-icon {
      width: 24px;
      height: 24px;
      background: #3498db;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.8rem;
      z-index: 1;
      flex-shrink: 0;
    }
    
    .timeline-content {
      flex: 1;
    }
    
    .timeline-date {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 5px;
    }
    
    .timeline-text {
      color: #2c3e50;
      font-weight: 500;
    }
    
    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    
    .gallery-item {
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }
    
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    
    /* Documents */
    .documents-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .document-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      text-decoration: none;
      color: #333;
      transition: background-color 0.3s;
    }
    
    .document-item:hover {
      background-color: #e9ecef;
    }
    
    .document-icon {
      color: #e74c3c;
      font-size: 1.2rem;
    }
    
    .document-name {
      flex: 1;
      font-weight: 500;
    }
    
    .document-size {
      color: #666;
      font-size: 0.9rem;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .hero-inner {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
      
      .project-header {
        flex-direction: column;
      }
      
      .project-actions {
        flex-direction: column;
      }
      
      .project-image {
        height: 200px;
      }
      
      .gallery {
        grid-template-columns: 1fr;
      }
    }
    
    /* Styles pour les cartes de statistiques */
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    
    .stat-card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    
    .stat-card h3 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    
    .stat-card p {
      margin-bottom: 10px;
      color: #555;
    }
    
    .progress-bar {
      height: 12px;
      background-color: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin: 15px 0;
    }
    
    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s ease;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    }
  </style>
</head>
<body>

  <header class="hero" role="banner">
    <div class="hero-inner">
      <div class="project-header" aria-label="En-tête du projet">
        <div class="avatar" aria-hidden="true">
          GP
        </div>
        <h1>Détail du projet</h1>
      </div>
      <nav>
        <a class="btn btn-primary" href="member-projects.html" aria-label="Retour aux projets">
          ← Retour aux projets
        </a>
      </nav>
    </div>
  </header>

  <main class="container" id="project-details" role="main">
    <!-- Navigation fil d'Ariane -->
    <div class="breadcrumb">
      <a href="index.html">Accueil</a>
      <span>→</span>
      <a href="member.html">Espace Membre</a>
      <span>→</span>
      <a href="member-projects.html">Mes Projets</a>
      <span>→</span>
      <span>Détails du Projet</span>
    </div>

    <!-- Contenu injecté dynamiquement par JavaScript -->
  </main>

  <script>
    // Fonction pour récupérer l'ID du projet depuis l'URL
    function getProjectIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    // Fonction pour formater les dates
    function formatDate(dateStr) {
      if (!dateStr) return '–';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fr-FR');
    }

    // Fonction pour afficher les détails du projet
    function renderProject(projet, progress) {
      return `
        <div class="stat-card">
          <h2>${projet.titre}</h2>
          <p>${projet.description}</p>
          <p><strong>Objectif :</strong> ${projet.objectif.toLocaleString()} FCFA</p>
          <p><strong>Montant actuel :</strong> ${projet.montant_actuel.toLocaleString()} FCFA</p>
          <div class="progress-bar" aria-label="Progression du projet">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>
          <p><strong>Avancement :</strong> ${progress}%</p>
          <p><strong>Statut :</strong> ${projet.statut}</p>
          <p><strong>Début :</strong> ${formatDate(projet.date_debut)} | <strong>Fin :</strong> ${formatDate(projet.date_fin)}</p>
        </div>
      `;
    }

    // Fonction pour afficher les étapes du projet
    function renderEtapes(etapes) {
      if (!etapes?.length) return `<p>Aucune étape enregistrée.</p>`;
      return `
        <ul>
          ${etapes.map(e => `<li><strong>${e.titre}</strong> – ${e.description} (${e.statut})</li>`).join('')}
        </ul>
      `;
    }

    // Fonction pour afficher les documents
    function renderDocuments(docs) {
      if (!docs?.length) return `<p>Aucun document disponible.</p>`;
      return `
        <ul>
          ${docs.map(d => `<li><a href="${d.url}" target="_blank" rel="noopener">${d.nom}</a></li>`).join('')}
        </ul>
      `;
    }

    // Fonction principale pour charger les détails du projet
    async function loadProjectDetails() {
      const projectId = getProjectIdFromURL();
      const container = document.getElementById('project-details');

      if (!projectId) {
        container.innerHTML = `<p>Identifiant du projet manquant.</p>`;
        return;
      }

      try {
        // Simulation de données (à remplacer par vos appels Supabase réels)
        // Dans un cas réel, vous utiliseriez votre client Supabase comme dans votre code original
        const projet = {
          id: projectId,
          titre: "Résidence Oasis",
          description: "Construction de 12 logements modernes à N'Djamena avec des espaces verts et des commodités partagées.",
          objectif: 1200000,
          montant_actuel: 780000,
          statut: "En cours",
          date_debut: "2025-06-01",
          date_fin: "2025-12-01"
        };

        const progress = Math.min((projet.montant_actuel / projet.objectif) * 100, 100).toFixed(1);

        // Simulation des étapes et documents (à remplacer par vos appels Supabase réels)
        const etapes = [
          { titre: "Phase 1", description: "Préparation du terrain", statut: "Terminé" },
          { titre: "Phase 2", description: "Fondations", statut: "Terminé" },
          { titre: "Phase 3", description: "Construction", statut: "En cours" },
          { titre: "Phase 4", description: "Finition", statut: "À venir" }
        ];

        const docs = [
          { nom: "Plan architectural.pdf", url: "#" },
          { nom: "Devis détaillé.xlsx", url: "#" },
          { nom: "Contrat de participation.pdf", url: "#" }
        ];

        container.innerHTML = `
          ${renderProject(projet, progress)}
          <div class="stat-card">
            <h3>📌 Étapes du projet</h3>
            ${renderEtapes(etapes)}
          </div>
          <div class="stat-card">
            <h3>📁 Documents</h3>
            ${renderDocuments(docs)}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<p>Une erreur est survenue lors du chargement du projet.</p>`;
        console.error(err);
      }
    }

    // Charger les détails du projet lorsque le DOM est prêt
    document.addEventListener('DOMContentLoaded', loadProjectDetails);
  </script>
</body>
</html>
